<circle cx="152.0" cy="82.0" r="6.5" fill="#D4AF37"/><circle cx="100.0" cy="82.0" r="42" fill="none" stroke="#8A8A8A" stroke-width="0.3" stroke-dasharray="1.2 0.8999999999999999"/><circle cx="100.0" cy="82.0" r="26.0" fill="none" stroke="#B5B5B5" stroke-width="0.3"/><circle cx="100.0" cy="82.0" r="58.0" fill="none" stroke="#B5B5B5" stroke-width="0.3"/><path d="M96.0 82.0H104.0M100.0 78.0V86.0" stroke="#E0218A" stroke-width="0.6"/><circle cx="100.0" cy="166.0" r="42" fill="none" stroke="#8A8A8A" stroke-width="0.3" stroke-dasharray="1.2 0.8999999999999999"/><circle cx="100.0" cy="166.0" r="26.0" fill="none" stroke="#B5B5B5" stroke-width="0.3"/><circle cx="100.0" cy="166.0" r="58.0" fill="none" stroke="#B5B5B5" stroke-width="0.3"/><path d="M96.0 166.0H104.0M100.0 162.0V170.0" stroke="#E0218A" stroke-width="0.6"/><ellipse cx="128.0" cy="74.0" rx="56.0" ry="54.0" fill="none" stroke="#00A3E0" stroke-width="0.3" stroke-dasharray="1.2 0.8999999999999999"/><circle cx="80.00" cy="58.00" r="1.3" fill="#00A3E0"/><circle cx="118.28" cy="20.82" r="1.3" fill="#00A3E0"/><circle cx="154.29" cy="26.32" r="1.3" fill="#00A3E0"/><circle cx="179.16" cy="52.04" r="1.3" fill="#00A3E0"/><circle cx="182.34" cy="87.06" r="1.3" fill="#00A3E0"/><circle cx="162.48" cy="116.55" r="1.3" fill="#00A3E0"/><circle cx="131.91" cy="127.87" r="1.3" fill="#00A3E0"/><line x1="100.0" y1="82.0" x2="149.50" y2="32.50" stroke="#E0218A" stroke-width="0.3"/><line x1="100.0" y1="166.0" x2="44.84" y2="209.10" stroke="#E0218A" stroke-width="0.3"/><path d="M42.0 78.0V86.0M74.0 78.0V86.0M42.0 82.0H74.0" stroke="#E0218A" stroke-width="0.6" fill="none"/><text x="58.00" y="79.00" font-family="Inter, Arial, sans-serif" font-size="6" font-weight="600" text-anchor="middle" fill="#FFFFFF">X</text><text x="103.00" y="79.00" font-family="Inter, Arial, sans-serif" font-size="3.4" font-weight="600" text-anchor="start" fill="#0B0B0B">C1</text><text x="103.00" y="163.00" font-family="Inter, Arial, sans-serif" font-size="3.4" font-weight="600" text-anchor="start" fill="#0B0B0B">C2</text><text x="150.91" y="31.09" font-family="Inter, Arial, sans-serif" font-size="3.4" font-weight="600" text-anchor="start" fill="#0B0B0B">-45°</text><text x="41.69" y="211.56" font-family="Inter, Arial, sans-serif" font-size="3.4" font-weight="600" text-anchor="end" fill="#0B0B0B">142°</text><text x="192.00" y="104.00" font-family="Inter, Arial, sans-serif" font-size="3.4" font-weight="600" text-anchor="start" fill="#0B0B0B">brain ellipse</text></g>
<text x="900" y="120" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#D4AF37">LOGO CONSTRUCTION</text><text x="900" y="180" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#0B0B0B" letter-spacing="-1">S + AI Brain symbol</text><text x="900" y="240" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">Grid</text><text x="1040" y="240" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">8-unit module. The symbol is 153.2 × 215.4 units (ratio</text><text x="1040" y="266" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">1 : 1.41).</text><text x="900" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">X</text><text x="1040" y="322" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">S stroke width = 32 units = 14.9% of symbol height. X</text><text x="1040" y="348" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">is the master measure.</text><text x="900" y="404" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">Letter S</text><text x="1040" y="404" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">Two tangent circles C1 / C2, centreline radius 42 (1.31</text><text x="1040" y="430" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">X), meeting on the spine.</text><text x="900" y="486" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">Terminals</text><text x="1040" y="486" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">Upper terminal cut at -45° so the tip ends inside the</text><text x="1040" y="512" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">brain; lower terminal at 142°.</text><text x="900" y="568" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">AI brain</text><text x="1040" y="568" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">Six lobes (arcs) on a 56 × 54 ellipse, contour 11 units</text><text x="1040" y="594" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">(0.34 X).</text><text x="900" y="650" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">Interlock</text><text x="1040" y="650" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">The front lobe arches over the S head, the S tip runs</text><text x="1040" y="676" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">under the brain, the last lobe tucks under the spine.</text><text x="1040" y="702" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">Gap at every crossing: 5 units.</text><text x="900" y="732" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">Circuit</text><text x="1040" y="732" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">Traces 6.5 units (0.2 X) radiate from a hub Ø17 at C1</text><text x="1040" y="758" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">to three nodes Ø13: one forward, two at 45°.</text><text x="900" y="814" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B0B0B">Colour</text><text x="1040" y="814" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">S #0B0B0B · brain, traces and nodes #D4AF37. Solid</text><text x="1040" y="840" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5C5C5C">fills only.</text>
<g font-family="Inter, Arial, sans-serif" font-size="16" fill="#5C5C5C"><line x1="900" y1="912" x2="930" y2="912" stroke="#E0218A" stroke-width="2"/><text x="940" y="918">centres, angles, X</text><line x1="1110" y1="912" x2="1140" y2="912" stroke="#00A3E0" stroke-width="2" stroke-dasharray="5 4"/><text x="1150" y="918">brain ellipse + lobe joints</text><line x1="1380" y1="912" x2="1410" y2="912" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4"/><text x="1420" y="918">centreline</text></g>
</svg>
