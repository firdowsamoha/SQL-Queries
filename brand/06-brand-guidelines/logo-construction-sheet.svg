#ECECEA" stroke-width="0.3"/><line x1="24" y1="232" x2="208" y2="232" stroke="#ECECEA" stroke-width="0.3"/><line x1="24" y1="240" x2="208" y2="240" stroke="#ECECEA" stroke-width="0.3"/><defs><mask id="sa-under-s" maskUnits="userSpaceOnUse" x="-60" y="-60" width="400" height="400"><rect x="-60" y="-60" width="400" height="400" fill="#fff"/><path d="M100.00 124.00 A42 42 0 1 1 66.90 191.86" fill="none" stroke="#000" stroke-width="42"/></mask><mask id="sa-under-brain" maskUnits="userSpaceOnUse" x="-60" y="-60" width="400" height="400"><rect x="-60" y="-60" width="400" height="400" fill="#fff"/><path d="M80.00 58.00 A33.08 33.08 0 0 1 118.28 20.82" fill="none" stroke="#000" stroke-width="21" stroke-linecap="round"/></mask></defs>
