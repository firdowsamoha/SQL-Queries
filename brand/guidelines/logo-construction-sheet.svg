#ECECEA" stroke-width="0.3"/><line x1="24" y1="232" x2="208" y2="232" stroke="#ECECEA" stroke-width="0.3"/><line x1="24" y1="240" x2="208" y2="240" stroke="#ECECEA" stroke-width="0.3"/><path id="brain-contour" d="M106.21 36.77 A16.67 16.67 0 0 1 133.03 34.70 A20.45 20.45 0 0 1 162.64 49.22 A18.49 18.49 0 0 1 175.80 75.99 A18.24 18.24 0 0 1 168.10 104.38 A19.01 19.01 0 0 1 143.48 122.65" fill="none" stroke="#D4AF37" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
